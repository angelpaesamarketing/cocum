<title>Cocum Origin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400;500&display=swap">
<style>
  /* Layout: una sola pantalla. Fondo atmosférico + partículas, el símbolo girando en 3D y una sola palabra. */
  :root {
    --ink:     #13110C;
    --ink-2:   #1E1810;
    --cream:   #F3EADA;
    --dim:     #9C8F78;
    --gold:    #D9B36B;
    --gold-hi: #F0D49A;
    --display: "Bodoni Moda", "Didot", Georgia, serif;
    --sans:    "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    font-weight: 300;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── capas de fondo ── */
  .layer { position: fixed; inset: 0; pointer-events: none; }

  #fondo {
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity .9s ease;
  }
  #fondo.on { opacity: .55; }

  .glow {
    background:
      radial-gradient(58% 48% at 50% 44%, rgba(217,179,107,.20) 0%, rgba(217,179,107,.07) 38%, transparent 72%),
      radial-gradient(120% 90% at 50% 0%, rgba(240,212,154,.10) 0%, transparent 60%);
    animation: breathe 9s ease-in-out infinite;
  }
  .rays {
    background:
      linear-gradient(176deg, rgba(240,212,154,.10) 0%, transparent 34%),
      linear-gradient(-172deg, rgba(240,212,154,.07) 0%, transparent 30%);
    filter: blur(22px);
  }
  .vignette {
    background: radial-gradient(130% 110% at 50% 45%, transparent 42%, rgba(10,8,5,.72) 100%);
  }
  #motas { display: block; width: 100%; height: 100%; }

  @keyframes breathe {
    0%, 100% { opacity: .82; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.045); }
  }

  /* ── contenido ── */
  .stage {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(22px, 4vh, 40px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(28px, 6vh, 56px);
    text-align: center;
  }

  .mark {
    perspective: 900px;
    width: clamp(132px, 26vmin, 236px);
    flex: none;
  }
  .mark img {
    display: block; width: 100%; height: auto;
    transform-origin: 50% 50%;
    animation: spin 11s cubic-bezier(.45,0,.55,1) infinite, bob 6.5s ease-in-out infinite;
    filter: drop-shadow(0 0 26px rgba(217,179,107,.42)) drop-shadow(0 0 70px rgba(217,179,107,.18));
  }
  @keyframes spin {
    0%   { transform: rotateY(-26deg) rotateX(5deg); }
    50%  { transform: rotateY(26deg)  rotateX(-4deg); }
    100% { transform: rotateY(-26deg) rotateX(5deg); }
  }
  @keyframes bob {
    0%, 100% { translate: 0 -5px; }
    50%      { translate: 0 5px; }
  }

  .lockup { display: grid; gap: clamp(7px, 1.3vh, 12px); justify-items: center; }
  .lockup img { width: clamp(190px, 46vmin, 330px); }
  .name {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(2.2rem, 9vmin, 4rem);
    line-height: .98; letter-spacing: .1em;
    margin: 0; padding-left: .1em;
    color: var(--cream);
  }
  .sub {
    font-size: clamp(.6rem, 1.7vmin, .76rem);
    letter-spacing: .62em; padding-left: .62em;
    color: var(--gold); margin: 0;
  }

  .soon { display: grid; gap: clamp(10px, 1.8vh, 16px); justify-items: center; }
  .rule {
    width: clamp(120px, 26vmin, 190px); height: 1px; border: 0; margin: 0;
    background: linear-gradient(90deg, transparent, rgba(217,179,107,.55), transparent);
  }
  .soon strong {
    font-weight: 400;
    font-size: clamp(.74rem, 2.1vmin, .94rem);
    letter-spacing: .44em; padding-left: .44em;
    color: var(--gold-hi);
  }
  .where {
    font-size: clamp(.56rem, 1.5vmin, .68rem);
    letter-spacing: .3em; padding-left: .3em;
    color: var(--dim); margin: 0;
  }

  .ig {
    position: fixed; left: 50%; translate: -50% 0;
    bottom: calc(clamp(16px, 3.4vh, 30px) + env(safe-area-inset-bottom, 0px));
    z-index: 3;
    font-size: .74rem; letter-spacing: .2em;
    color: var(--dim); text-decoration: none;
    padding: 9px 14px; border-radius: 999px;
    transition: color .2s ease, background .2s ease;
  }
  .ig:hover, .ig:focus-visible { color: var(--gold-hi); background: rgba(217,179,107,.09); }
  :focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .mark img { animation: none; transform: rotateY(-8deg); }
    .glow { animation: none; }
  }
</style>

<div class="layer glow"></div>
<div class="layer rays"></div>
<div class="layer" id="fondo"></div>
<canvas class="layer" id="motas" aria-hidden="true"></canvas>
<div class="layer vignette"></div>

<main class="stage">
  <div class="mark">
    <img src="img/marca-alpha.png" width="512" height="512" alt="Símbolo de Cocum Origin">
  </div>

  <div class="lockup" id="lockup">
    <p class="name">COCUM</p>
    <p class="sub">ORIGIN</p>
  </div>

  <div class="soon">
    <hr class="rule">
    <strong id="soon">PRÓXIMAMENTE</strong>
    <p class="where" id="where">GUARDAMAR DEL SEGURA · ENERO</p>
  </div>
</main>

<a class="ig" id="ig" href="#">@cocumorigin</a>

<script>
  // ─────────────────────────────────────────────────────────────
  // 1. Confirma el usuario real antes de publicar: es el único enlace.
  const INSTAGRAM = "https://www.instagram.com/cocumorigin/";
  // 2. Imagen de ambiente generada (sin comida, sin texto). Déjala en
  //    img/ y pon aquí el nombre, p. ej. "img/ambiente.jpg".
  const FONDO = "";
  // 3. Si tienes el logotipo completo en PNG con transparencia o SVG,
  //    ponlo aquí y sustituye al texto compuesto.
  const LOGOTIPO = "";
  // ─────────────────────────────────────────────────────────────

  const ig = document.getElementById("ig");
  ig.href = INSTAGRAM; ig.target = "_blank"; ig.rel = "noopener";

  if (FONDO) {
    const el = document.getElementById("fondo");
    const probe = new Image();
    probe.onload = () => { el.style.backgroundImage = `url("${FONDO}")`; el.classList.add("on"); };
    probe.src = FONDO;
  }

  if (LOGOTIPO) {
    const box = document.getElementById("lockup");
    box.innerHTML = "";
    const img = new Image();
    img.src = LOGOTIPO;
    img.alt = "Cocum Origin";
    box.appendChild(img);
  }

  const en = (navigator.language || "es").toLowerCase().startsWith("en");
  document.documentElement.lang = en ? "en" : "es";
  if (en) {
    document.getElementById("soon").textContent = "COMING SOON";
    document.getElementById("where").textContent = "GUARDAMAR DEL SEGURA · JANUARY";
  }

  /* ── partículas ── */
  const cv = document.getElementById("motas");
  const ctx = cv.getContext("2d");
  const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let motas = [], w = 0, h = 0, dpr = 1;

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, Math.max(26, w * h / 26000)));
    motas = Array.from({ length: n }, () => nueva(true));
  }

  function nueva(inicial) {
    return {
      x: Math.random() * w,
      y: inicial ? Math.random() * h : h + 12,
      r: 0.5 + Math.random() * 2.1,
      v: 0.10 + Math.random() * 0.34,
      deriva: (Math.random() - 0.5) * 0.17,
      a: 0.12 + Math.random() * 0.5,
      f: Math.random() * Math.PI * 2
    };
  }

  function pintar() {
    ctx.clearRect(0, 0, w, h);
    for (const m of motas) {
      const parpadeo = 0.72 + 0.28 * Math.sin(m.f);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(233, 201, 138, ${(m.a * parpadeo).toFixed(3)})`;
      ctx.fill();
    }
  }

  function paso() {
    for (const m of motas) {
      m.y -= m.v; m.x += m.deriva; m.f += 0.012;
      if (m.y < -12 || m.x < -12 || m.x > w + 12) Object.assign(m, nueva(false));
    }
    pintar();
    requestAnimationFrame(paso);
  }

  medir();
  window.addEventListener("resize", medir);
  if (quieto) pintar(); else requestAnimationFrame(paso);
</script>
